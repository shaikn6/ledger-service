openapi: 3.1.0
info:
  title: ledger-service
  description: >
    Double-entry accounting ledger. Every movement of money is an idempotent
    transfer that produces exactly two balanced postings applied atomically
    with both account balances.
  version: 0.2.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: accounts
  - name: transfers
  - name: ops
paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: alive }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200": { description: ready }
        "503": { description: database unavailable }
  /version:
    get:
      tags: [ops]
      summary: Build metadata
      security: []
      responses:
        "200":
          description: build info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      security: []
      responses:
        "200": { description: metrics exposition }
  /v1/accounts:
    post:
      tags: [accounts]
      summary: Open an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                name: { type: string }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                allow_overdraft: { type: boolean, default: false }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [accounts]
      summary: List accounts (newest first)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: page of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Account" }
  /v1/accounts/{id}:
    get:
      tags: [accounts]
      summary: Get an account
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/accounts/{id}/postings:
    get:
      tags: [accounts]
      summary: List an account's postings (newest first)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: before, in: query, schema: { type: integer }, description: return postings with id below this }
      responses:
        "200":
          description: postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  postings:
                    type: array
                    items: { $ref: "#/components/schemas/Posting" }
  /v1/transfers:
    post:
      tags: [transfers]
      summary: Post a transfer
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_account_id, credit_account_id, amount, currency]
              properties:
                debit_account_id: { type: string, format: uuid }
                credit_account_id: { type: string, format: uuid }
                amount: { type: integer, description: minor units, minimum: 1 }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201":
          description: transfer posted (or the original, on idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [transfers]
      summary: List transfers (newest first)
      parameters:
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: page of transfers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Transfer" }
  /v1/transfers/{id}:
    get:
      tags: [transfers]
      summary: Get a transfer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/transfers/{id}/postings:
    get:
      tags: [transfers]
      summary: The two postings that make up a transfer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  postings:
                    type: array
                    items: { $ref: "#/components/schemas/Posting" }
  /v1/transfers/{id}/reversals:
    post:
      tags: [transfers]
      summary: Reverse a transfer with a compensating transfer
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: compensating transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: already reversed, $ref: "#/components/responses/Error" }
        "422": { description: cannot reverse a reversal, $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        balance: { type: integer, description: minor units }
        allow_overdraft: { type: boolean }
        created_at: { type: string, format: date-time }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        idempotency_key: { type: string }
        debit_account_id: { type: string, format: uuid }
        credit_account_id: { type: string, format: uuid }
        amount: { type: integer, description: minor units }
        currency: { type: string }
        status: { type: string, enum: [posted, reversed] }
        reverses_transfer_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    Posting:
      type: object
      properties:
        id: { type: integer }
        transfer_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: integer }
        balance_after: { type: integer }
        created_at: { type: string, format: date-time }
    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        next_cursor: { type: string, description: empty when there are no more rows }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
security:
  - bearerAuth: []
