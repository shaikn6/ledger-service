services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  ledger:
    build:
      context: .
      args:
        VERSION: local
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
      LEDGER_ADDR: ":8080"
      LOG_LEVEL: info
      # Uncomment to require a bearer token on /v1 routes:
      # LEDGER_API_TOKENS: "dev-token-1,dev-token-2"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
